<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

    <h1>Iniciar sesión</h1>

    <form id="loginForm">

        <input
            type="email"
            id="correo"
            placeholder="Correo"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button type="submit">
            Entrar
        </button>

    </form>

    <p id="mensaje"></p>

    <script src="app.js" ></script>

</body>
</html>
